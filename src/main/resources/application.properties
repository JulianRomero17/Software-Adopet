spring.application.name=adopet

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Hibernate actualiza el esquema antes de cargar el catálogo inicial.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

adopet.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
adopet.admin.bootstrap.reset-existing-password=${ADMIN_BOOTSTRAP_RESET_PASSWORD:false}
adopet.admin.bootstrap.nombre=${ADMIN_NAME:}
adopet.admin.bootstrap.documento=${ADMIN_DOCUMENT:}
adopet.admin.bootstrap.correo=${ADMIN_EMAIL:}
adopet.admin.bootstrap.contrasena=${ADMIN_PASSWORD:}
