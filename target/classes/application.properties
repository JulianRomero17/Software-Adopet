spring.application.name=adopet

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Hibernate actualiza el esquema antes de cargar el catálogo inicial.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Servicio independiente de correo transaccional
adopet.notifications.url=${NOTIFICATION_SERVICE_URL:http://localhost:8081}
adopet.notifications.api-key=${NOTIFICATION_SERVICE_API_KEY:}

adopet.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
adopet.admin.bootstrap.reset-existing-password=${ADMIN_BOOTSTRAP_RESET_PASSWORD:false}
adopet.admin.bootstrap.nombre=${ADMIN_NAME:}
adopet.admin.bootstrap.documento=${ADMIN_DOCUMENT:}
adopet.admin.bootstrap.correo=${ADMIN_EMAIL:}
adopet.admin.bootstrap.contrasena=${ADMIN_PASSWORD:}
